[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buraq"
version = "1.5.2"
description = "A high-performance Django-like framework built on FastAPI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["fastapi", "framework", "async", "web", "django-like", "asgi"]
authors = [{ name = "Nezanuha" }]
maintainers = [{ name = "Nezanuha" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.111.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "slowapi>=0.1.9",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "orjson>=3.10.0",
    "granian>=2.0.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.2.0",
    "aiosmtplib>=5.0.0",
    "babel>=2.14.0",
]

[project.urls]
Homepage = "https://buraqproject.com"
Documentation = "https://buraqproject.com/docs"
Source = "https://github.com/nezanuha/buraq"
Tracker = "https://github.com/nezanuha/buraq/issues"
Changelog = "https://github.com/nezanuha/buraq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres  = ["asyncpg>=0.29.0"]
mysql     = ["aiomysql>=0.2.0"]
memcached = ["aiomcache>=0.8.0"]
redis     = ["redis[hiredis]>=5.0.0"]
# Brings uv along so `buraq startproject` uses it rather than falling back to
# venv + pip. Opt-in: it is a large binary, and nothing else here needs it.
uv        = ["uv>=0.5.0"]

# PEP 735 dependency groups — uv's native format for dev/test deps
# Install with: uv sync --group dev
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
buraq = "buraq.management.cli:app"

# ─── uv configuration ─────────────────────────────────────────────────────────
[tool.uv]
# This is a real installable package (not just a script collection)
package = true
# uv manages the virtual environment and lockfile
managed = true
# default groups to install when running `uv sync`
default-groups = ["dev"]

[tool.uv.sources]

# ─── Hatchling ────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["buraq"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in default args

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ─── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
