[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buraq"
version = "1.3.0"
description = "A high-performance Django-like framework built on FastAPI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["fastapi", "framework", "async", "web", "django-like"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.111.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.19",
    "alembic>=1.13.0",
    "sqladmin>=0.18.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "slowapi>=0.1.9",
    "secure>=0.3.0",
    "asyncpg>=0.29.0",
    "pyjwt[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
    "orjson>=3.10.0",
    "granian>=1.5.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.2.0",
    "aiofiles>=23.2.0",
    "aiosmtplib>=3.0.0",
    "babel>=2.14.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
mysql      = ["aiomysql>=0.2.0"]
sqlite     = ["aiosqlite>=0.20.0"]
memcached  = ["aiomcache>=0.8.0"]
production = ["whitenoise>=6.7.0", "gunicorn>=22.0.0"]

# PEP 735 dependency groups — uv's native format for dev/test deps
# Install with: uv sync --group dev
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",   # SQLite async driver for tests
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mike>=2.1.0",
]

[project.scripts]
buraq = "buraq.management.cli:app"

# ─── uv configuration ─────────────────────────────────────────────────────────
[tool.uv]
# This is a real installable package (not just a script collection)
package = true
# uv manages the virtual environment and lockfile
managed = true
# default groups to install when running `uv sync`
default-groups = ["dev"]

[tool.uv.sources]
# When developing locally, use the workspace package directly
# buraq = { workspace = true }

# ─── Hatchling ────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["buraq"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in default args

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ─── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
