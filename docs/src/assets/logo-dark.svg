<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1278.4 400.0"
     width="1278" height="400" role="img" aria-label="Buraq">
  <!--
    Buraq wordmark lockup. Pure vector, no embedded raster.

    The mark was vectorised from Buraq-dual-3.png by contour tracing rather than
    by eye: both bolts isolated by luminance, boundaries followed, simplified to
    18 and 22 vertices. Rendered back and diffed against the source, 1.14 percent
    of pixels differ by more than 24/255, which is edge antialiasing.

    The gradient was fitted, not guessed. Correlating position against colour
    across the dark bolt puts the axis at 95 degrees, running #0b4131 to #2c5c58.

    The word is real outlines from Onest 700, the face the site already uses,
    pulled with fontTools. Deliberately NOT an SVG text element: an SVG loaded as
    an image cannot reach webfonts, so text would fall back to whatever the OS
    supplies and the wordmark would change shape per platform. Tracking -0.03em,
    matching the header's own title.

    Glyph offsets are in font units because the wrapping g already applies the
    scale. Multiplying them by it as well stacks every letter on the first.

    Word in #79c9a2, the mark's own mint: 10.01:1 on the dark page. The dark green
    is 1.70:1 there and would be unreadable, so the dark file differs by that one value.
  -->
  <defs>
    <linearGradient id="bqg" gradientUnits="userSpaceOnUse"
      x1="204.4" y1="-11.3" x2="171.7" y2="362.1">
      <stop offset="0" stop-color="#0b4131"/>
      <stop offset="1" stop-color="#2c5c58"/>
    </linearGradient>
  </defs>
  <path fill="url(#bqg)" d="M334.0 0.0 345.0 2.0 379.0 39.0 397.0 60.0 397.0 72.0 235.0 273.0 227.0 278.0 218.0 277.0 144.0 206.0 136.0 204.0 122.0 215.0 19.0 344.0 11.0 348.0 3.0 346.0 0.0 339.0 2.0 331.0 122.0 121.0 129.0 118.0 137.0 120.0 211.0 189.0 222.0 188.0 328.0 4.0Z"/>
