site_name: Buraq
site_description: A high-performance Django-like async web framework built on FastAPI & SQLAlchemy 2.0
site_url: https://buraqproject.com/docs
repo_url: https://github.com/nezanuha/buraq
repo_name: buraq
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

hooks:
  - docs/hooks.py

plugins:
  - search

extra:
  version:
    provider: mike
    default: 1.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nezanuha/buraq
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/buraq

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Project Structure: getting-started/project-structure.md
    - Settings: getting-started/settings.md
  - Tutorial:
    - tutorial/index.md
    - Part 1 — Models: tutorial/models.md
    - Part 2 — Views & URLs: tutorial/views-urls.md
    - Part 3 — Forms: tutorial/forms.md
    - Part 4 — Templates: tutorial/templates.md
    - Part 5 — Authentication: tutorial/authentication.md
  - Topics:
    - ORM:
      - Models: topics/orm/models.md
      - Querying: topics/orm/querying.md
      - Relationships: topics/orm/relationships.md
      - Migrations: topics/orm/migrations.md
    - Views:
      - Function-Based Views: topics/views/function-based.md
      - Class-Based Views: topics/views/class-based.md
      - Generic Views: topics/views/generic.md
    - Forms:
      - Overview: topics/forms/overview.md
      - Fields: topics/forms/fields.md
      - Validation: topics/forms/validation.md
      - ModelForm: topics/forms/modelform.md
    - Templates: topics/templates.md
    - Template Loader: topics/template-loader.md
    - URLs: topics/urls.md
    - Middleware: topics/middleware.md
    - HTTP Responses: topics/http-responses.md
    - Authentication: topics/authentication.md
    - Sessions: topics/sessions.md
    - Cache: topics/cache.md
    - Signals: topics/signals.md
    - Internationalization: topics/i18n.md
    - Translatable Models: topics/translatable-models.md
    - Timezone: topics/timezone.md
    - Sitemaps: topics/sitemaps.md
    - Admin: topics/admin.md
    - Static Files: topics/static-files.md
    - Email: topics/email.md
  - Management Commands:
    - Built-in Commands: management/commands.md
    - Custom Commands: management/custom-commands.md
  - Deployment:
    - Overview: deployment/overview.md
    - PostgreSQL: deployment/postgresql.md
    - Docker: deployment/docker.md
  - Migrating from Django: migrating-from-django.md
  - API Reference:
    - buraq.orm: reference/orm.md
    - buraq.forms: reference/forms.md
    - buraq.views: reference/views.md
    - buraq.shortcuts: reference/shortcuts.md
    - buraq.urls: reference/urls.md
