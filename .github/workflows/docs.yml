name: Deploy Docs

on:
  push:
    tags:
      - "v*"          # triggers on v1.0, v1.1, v2.0, etc.

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # mike needs full git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        run: |
          VERSION=${GITHUB_REF_NAME#v}          # strips "v" → 1.0.0, 2.0.0
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)   # 1.0.0 → 1.0
          uv run mike deploy --push --deploy-prefix docs "$MINOR" latest
          uv run mike set-default --push --deploy-prefix docs latest
