name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Buraq scaffolds files, re-executes itself through a virtualenv and shells
    # out to alembic -- all of which behave differently per OS. Testing only on
    # Linux is how a scaffolded main.py written in the Windows locale encoding
    # (cp1252) shipped as a project that would not even parse.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check buraq/

      # Failures are echoed as ::error:: so they land in the run's annotations,
      # which are readable without admin rights on the repository. Without this
      # a failure here is just "exit code 1" to anyone who cannot download the
      # log, which is everyone but the owner.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR)' pytest.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production-use"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"

      # Granian is the default server `buraq runserver` starts and what the
      # deployment docs recommend, but it is a compiled Rust extension: it can
      # import cleanly and still have its worker die on start. Boot it against a
      # real request so a broken default is caught here rather than in production.
      - name: Smoke test the default server (granian)
        # Bash heredoc and backgrounding; the point is whether the compiled
        # extension serves, which one platform answers well enough.
        if: runner.os == 'Linux'
        run: |
          cat > ci_smoke_app.py <<'APP'
          async def app(scope, receive, send):
              if scope['type'] == 'lifespan':
                  while True:
                      m = await receive()
                      if m['type'] == 'lifespan.startup':
                          await send({'type': 'lifespan.startup.complete'})
                      elif m['type'] == 'lifespan.shutdown':
                          await send({'type': 'lifespan.shutdown.complete'})
                          return
                  return
              await send({'type': 'http.response.start', 'status': 200,
                          'headers': [(b'content-type', b'text/plain')]})
              await send({'type': 'http.response.body', 'body': b'ok'})
          APP
          uv run granian --interface asgi --host 127.0.0.1 --port 8123 ci_smoke_app:app &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/ >/dev/null 2>&1; then
              echo 'granian served a request'; exit 0
            fi
            sleep 1
          done
          echo 'granian never served a request — the default server is broken on this platform'
          exit 1

  # The matrix above runs against SQLite, which is what a fresh clone uses. These
  # two run the same suite against a real server, because the differences that
  # bite -- sequences, locking, collation, what a driver accepts -- are exactly
  # the ones SQLite cannot show. Linux only: GitHub service containers do not run
  # on the Windows or macOS images. One Python version, since this is testing the
  # database rather than the interpreter.

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buraq
          POSTGRES_PASSWORD: buraq
          POSTGRES_DB: buraq_test
        ports: ["5432:5432"]
        # Without this the suite can connect before the server is accepting.
        options: >-
          --health-cmd "pg_isready -U buraq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev --extra postgres
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR)' pytest.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production-use"
          DATABASE_URL: "postgresql+asyncpg://buraq:buraq@127.0.0.1:5432/buraq_test"

  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: buraq
          MYSQL_DATABASE: buraq_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pburaq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev --extra mysql
      # utf8mb4, not utf8: the latter is three bytes and cannot store every
      # character, which shows up as a truncation error rather than as encoding.
      - name: Use utf8mb4
        run: >-
          mysql -h 127.0.0.1 -uroot -pburaq -e
          "ALTER DATABASE buraq_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR)' pytest.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production-use"
          DATABASE_URL: "mysql+aiomysql://root:buraq@127.0.0.1:3306/buraq_test"
