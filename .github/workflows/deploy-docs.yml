name: Deploy docs

# Documentation ships when documentation changes. The release workflow only
# builds the site when the version in pyproject.toml has no tag yet, so a fix to
# a page went unpublished until the next release — which is the wrong coupling
# for docs.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  # A second push should replace a running deploy, not race it onto the server.
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastmod in the sitemap is read from commit dates, which a shallow
          # clone does not carry.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

      - name: Check the build produced what we expect
        run: |
          test -f docs/dist/index.html            || { echo "no home page"; exit 1; }
          test -f docs/dist/.htaccess             || { echo "no .htaccess"; exit 1; }
          test -f docs/dist/sitemap.xml           || { echo "no sitemap"; exit 1; }
          test -f docs/dist/robots.txt            || { echo "no robots.txt"; exit 1; }
          echo "pages: $(find docs/dist -name index.html | wc -l)"

      - name: Confirm the deploy secrets are present
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PATH_REMOTE: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ]        || missing="$missing HOSTINGER_SSH_HOST"
          [ -n "$USER" ]        || missing="$missing HOSTINGER_SSH_USER"
          [ -n "$PATH_REMOTE" ] || missing="$missing HOSTINGER_REMOTE_PATH"
          [ -n "$KEY" ]         || missing="$missing HOSTINGER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            exit 1
          fi

      - name: Set up the SSH key
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A truncated or mangled secret is the usual cause of a failure here,
          # and it reads as a connection problem later if it is not caught now.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "HOSTINGER_SSH_KEY is not a usable private key."
            echo "Paste the whole file: BEGIN line, body, and END line."
            exit 1
          fi
          echo "key loaded: $(ssh-keygen -l -f ~/.ssh/deploy_key | cut -d' ' -f1-2)"

          # Pinning the host key means a changed fingerprint fails the deploy
          # rather than being accepted silently. Errors are deliberately kept:
          # whatever ssh-keyscan prints here is the whole diagnosis.
          echo "scanning ${HOST}:${PORT:-22}"
          if ! ssh-keyscan -T 15 -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts; then
            echo "Could not read a host key from ${HOST}:${PORT:-22}."
            echo "Check HOSTINGER_SSH_HOST and HOSTINGER_SSH_PORT (Hostinger"
            echo "usually listens on 65002, not 22) and that SSH access is"
            echo "switched on in hPanel."
            exit 1
          fi

          if ! grep -q . ~/.ssh/known_hosts; then
            echo "Reached ${HOST} but it returned no host key."
            exit 1
          fi

      - name: Check the destination exists
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          ssh_do() { ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$USER@$HOST" "$@"; }

          # rsync creates the last directory but not the ones above it, and
          # reports the whole path as missing either way. The path is a secret,
          # so the failure is masked in the log -- listing the real directories
          # is the only way to see what it should have been.
          if ssh_do "test -d \"$REMOTE\""; then
            echo "destination exists"
            exit 0
          fi

          echo "HOSTINGER_REMOTE_PATH does not exist on the server."
          echo "Deliberately not creating it: a typo would be published to a"
          echo "directory nothing serves, and look like a successful deploy."
          echo ""
          echo "Document roots on this account:"
          ssh_do 'ls -d ~/domains/*/public_html 2>/dev/null || true'
          echo ""
          echo "Home directory:"
          ssh_do 'ls -la ~ | head -20'
          exit 1

      - name: Upload
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          # --delete removes files the build no longer produces; the trailing
          # slash on the source copies the contents rather than the directory.
          rsync -az --delete --omit-dir-times --no-perms \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT:-22} -o StrictHostKeyChecking=yes" \
            docs/dist/ "$USER@$HOST:$REMOTE/"

      - name: Verify the site answers
        env:
          SITE: ${{ secrets.DOCS_SITE_URL }}
        run: |
          url="${SITE:-https://buraqproject.com}"
          echo "checking $url"
          # A URL without a trailing slash must return 200 rather than redirect:
          # the site is built trailingSlash: 'never' and Apache would otherwise
          # 301 to the slashed form.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/docs/getting-started/installation")
          echo "  /docs/getting-started/installation -> $code"
          [ "$code" = "200" ] || exit 1
          robots=$(curl -sI "$url/docs/getting-started/installation.md" | tr -d '\r' | grep -i '^x-robots-tag:' || true)
          echo "  markdown route -> ${robots:-no X-Robots-Tag}"
