name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "//;s/"//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git tag | grep -q "^${TAG}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for this version
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "❌ No changelog entry found for version $VERSION"
            exit 1
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.tag_check.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.tag_check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v3

      - name: Build package
        if: steps.tag_check.outputs.exists == 'false'
        run: uv build

      - name: Publish to PyPI
        if: steps.tag_check.outputs.exists == 'false'
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Install docs dependencies
        if: steps.tag_check.outputs.exists == 'false'
        run: uv sync --group docs

      - name: Configure git
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)

          # Redeploy the current latest with noindex before it loses the alias,
          # but only when it's a different version (guards against re-releasing same minor).
          PREV=$(uv run mike list --deploy-prefix docs 2>/dev/null | grep '\[latest\]' | awk '{print $1}')
          if [ -n "$PREV" ] && [ "$PREV" != "$MINOR" ]; then
            BURAQ_DOCS_NOINDEX=1 uv run mike deploy --push --deploy-prefix docs "$PREV"
          fi

          uv run mike deploy --push --deploy-prefix docs --update-aliases "$MINOR" latest
          uv run mike set-default --push --deploy-prefix docs latest

      - name: Create git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
